# ============================================================
#  Big Data Lab Runner - manual overrides (all optional)
#  Leave a value empty ("") to let the runner auto-detect it.
#  Edit this file only when auto-detection picks the wrong copy.
# ============================================================

# Installation directories (home folders, not bin folders).
CFG_JAVA_HOME=""
CFG_HADOOP_HOME=""
CFG_PIG_HOME=""
CFG_HIVE_HOME=""
CFG_SPARK_HOME=""
CFG_KAFKA_HOME=""

# Where lab work files (sources, jars, local outputs) are created.
LAB_WORKDIR_BASE="$HOME/bigdata_labs"

# Base directory used inside HDFS for lab input and output.
HDFS_LAB_BASE="/user/$(id -un)/bigdata_labs"

# Directories scanned when a tool is not found (space separated).
SEARCH_ROOTS="$HOME /home /opt /usr/local /usr/lib /usr/share"

# Directory used for HDFS name/data dirs when the runner has to write a
# Hadoop configuration from scratch (only happens if fs.defaultFS is not set).
HADOOP_DATA_DIR="$HOME/hadoopdata"

# 1 = allow the runner to write a pseudo-distributed Hadoop config when none exists.
AUTO_WRITE_HADOOP_CONF=1
# 1 = allow the runner to install missing Python packages (pip --user, then apt with sudo).
AUTO_INSTALL_PY=1
# 1 = allow the runner to start missing services (HDFS, YARN, MongoDB, ZooKeeper, Kafka).
AUTO_START_SERVICES=1

# Seconds to wait for a service (NameNode, Kafka, MongoDB...) before giving up.
SERVICE_TIMEOUT=90
# Maximum number of automatic fix-and-retry rounds for one command.
MAX_FIX_ATTEMPTS=2

# Ports used by the labs.
LAB9_STREAM_PORT=9999
KAFKA_PORT=9092

# Terminal emulator for the lab windows ("" = auto-detect).
TERM_EMULATOR=""
