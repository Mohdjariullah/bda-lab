# ============================================================
#  Big Data Lab Runner - manual overrides (all optional)
#  Leave a value empty ("") to let the runner auto-detect it.
#  Edit this file only when auto-detection picks the wrong copy.
# ============================================================

# 0 = use only the runner's own copies of Hadoop, Pig, Hive, Spark, Kafka and
#     Java 8 in STACK_DIR (installed by Setup, versions tested together). Other
#     copies on this PC are ignored, whatever state they are in.
# 1 = also search the PC and use what is found (own copy only when a tool is
#     missing or does not start).
REUSE_INSTALLED=0

# Force a specific installation (home folders, not bin folders). "" = not forced.
CFG_JAVA_HOME=""
CFG_HADOOP_HOME=""
CFG_PIG_HOME=""
CFG_HIVE_HOME=""
CFG_SPARK_HOME=""
CFG_KAFKA_HOME=""

# Where lab work files (sources, jars, local outputs) are created.
LAB_WORKDIR_BASE="$HOME/bigdata_labs"

# Base directory used inside HDFS for lab input and output.
HDFS_LAB_BASE="/user/$(id -un)/bigdata_labs"

# Directories scanned for tools when REUSE_INSTALLED=1 (space separated).
SEARCH_ROOTS="$HOME /home /opt /usr/local /usr/lib /usr/share"

# Directory used for HDFS name/data dirs when the runner has to write a
# Hadoop configuration from scratch (only happens if fs.defaultFS is not set).
HADOOP_DATA_DIR="$HOME/hadoopdata"

# 1 = allow the runner to write a pseudo-distributed Hadoop config when none exists.
AUTO_WRITE_HADOOP_CONF=1
# 1 = allow the runner to install missing Python packages (pip --user, no password).
AUTO_INSTALL_PY=1
# 1 = allow the runner to start missing services (HDFS, YARN, ZooKeeper, Kafka).
AUTO_START_SERVICES=1

# 1 = install missing lab software automatically when the runner starts
#     (Java 8, Hadoop, Pig, Hive, Spark, Kafka). 0 = only the S menu entry installs.
AUTO_SETUP=1
# Where Setup unpacks Hadoop, Pig, Hive, Spark and Kafka (no root needed).
STACK_DIR="$HOME/bigdata_stack"
# Versions Setup downloads (only change these if a lab needs a different one).
# HADOOP_VER=3.3.6  PIG_VER=0.17.0  HIVE_VER=3.1.3  SPARK_VER=3.5.3  KAFKA_INSTALL_VER=3.6.2

# 1 = the lab window shows only commands, their output and failures (everything
#     else goes to the log). 0 = also show headers, [CHECK]/[STEP] lines and the
#     "COMPLETED SUCCESSFULLY" banner.
LAB_RAW_OUTPUT=1

# 1 = every lab opens in its own terminal window. 0 = labs run in the launcher
#     window (same as "./lab-runner --here ...").
LAB_NEW_WINDOW=1

# Seconds to wait for a service (NameNode, Kafka, MongoDB...) before giving up.
SERVICE_TIMEOUT=90
# Maximum number of automatic fix-and-retry rounds for one command.
MAX_FIX_ATTEMPTS=2

# Ports used by the labs.
LAB9_STREAM_PORT=9999
KAFKA_PORT=9092

# Terminal emulator for the lab windows ("" = auto-detect).
TERM_EMULATOR=""
